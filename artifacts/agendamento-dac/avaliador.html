<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Avaliador - DAC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f0f2f5;color:#333}

        #loginOverlay{position:fixed;inset:0;background:linear-gradient(135deg,#2563eb,#1d4ed8);display:flex;align-items:center;justify-content:center;z-index:9999}
        .login-box{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
        .login-box h1{font-size:22px;color:#444;text-align:center;margin-bottom:6px}
        .login-box p{font-size:13px;color:#888;text-align:center;margin-bottom:28px}
        .form-field{margin-bottom:16px}
        .form-field label{display:block;font-size:12px;font-weight:700;color:#555;margin-bottom:6px}
        .form-field input{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;transition:.2s}
        .form-field input:focus{outline:none;border-color:#2563eb}
        .password-wrap{position:relative}
        .password-wrap input{padding-right:42px}
        .toggle-password{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;background:transparent;color:#888;cursor:pointer;border-radius:6px}
        .toggle-password:hover,.toggle-password:focus{background:#eff6ff;color:#2563eb;outline:none}
        .btn-login{width:100%;padding:13px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s}
        .btn-login:hover{opacity:.9}
        .login-err{color:#d9534f;font-size:13px;text-align:center;margin-top:12px;display:none}

        #appShell{display:none}
        .topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.05)}
        .topbar-left{display:flex;align-items:center;gap:12px}
        .topbar-left h1{font-size:18px;color:#444;font-weight:700}
        .role-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;background:#dbeafe;color:#1d4ed8}
        .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
        .btn-top{padding:8px 14px;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;transition:.2s}
        .btn-top:hover{opacity:.85}
        .btn-refresh{background:#2563eb;color:#fff}
        .btn-logout{background:#eee;color:#555;border:1px solid #ddd}

        .content-wrap{padding:24px;max-width:1100px;margin:0 auto}
        .filters-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
        .search-wrap{position:relative;flex:1;min-width:200px;max-width:360px}
        .search-wrap input{width:100%;padding:9px 12px 9px 36px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;outline:none}
        .search-wrap input:focus{border-color:#2563eb}
        .search-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#aaa;font-size:13px}
        .filter-sel{padding:9px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;background:#fff;outline:none;cursor:pointer}
        .filter-sel:focus{border-color:#2563eb}

        .av-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:12px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
        .av-card.open{border-color:#93c5fd;box-shadow:0 4px 14px rgba(37,99,235,.09)}
        .av-card-main{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px}
        .av-info{min-width:0}
        .av-info h4{font-size:14px;font-weight:700;margin-bottom:4px}
        .av-info p{font-size:12px;color:#666}
        .av-score{font-size:18px;font-weight:800;color:#2563eb}
        .av-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}
        .av-drawer{border-top:1px solid #dbeafe;background:#fbfdff;padding:22px 24px 24px;animation:drawerOpen .18s ease-out}
        @keyframes drawerOpen{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
        .drawer-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
        .drawer-heading h3{font-size:16px;color:#1e3a8a;margin:0}
        .drawer-heading p{font-size:12px;color:#64748b;margin-top:4px}
        .drawer-loading{text-align:center;color:#2563eb;padding:24px;font-size:13px}
        .drawer-grid{display:grid;grid-template-columns:160px 1fr;gap:8px 14px;font-size:13px}
        .drawer-grid .lbl{font-weight:600;color:#555}
        .drawer-grid .val{color:#222;word-break:break-word}
        .drawer-grid .val a{color:#2563eb;text-decoration:none;word-break:break-all}
        .drawer-grid .val a:hover{text-decoration:underline}
        .drawer-section{margin-bottom:22px}
        .drawer-section:last-child{margin-bottom:0}
        .drawer-section h4{font-size:14px;font-weight:700;color:#1d4ed8;border-bottom:2px solid #dbeafe;padding-bottom:6px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .drawer-event-list{margin:0;padding-left:18px;font-size:13px;color:#222}
        .drawer-event-list li{margin-bottom:4px}
        .drawer-empty{font-size:13px;color:#888;font-style:italic;padding:8px 0}
        .drawer-link-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;color:#1d4ed8;text-decoration:none;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
        .drawer-link-pill:hover{background:#dbeafe}
        .drawer-evaluation{border-top:1px solid #dbeafe;margin-top:24px;padding-top:20px}
        .drawer-evaluation h4{font-size:15px;color:#1e3a8a;margin-bottom:6px}
        .drawer-evaluation-note{font-size:12px;color:#64748b;margin-bottom:16px}
        .drawer-save{text-align:right;margin-top:18px}
        .av-status{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:#fef3c7;color:#92400e;margin-left:8px}
        .av-status.done{background:#d1fae5;color:#065f46}
        .local-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
        .local-teatro{background:#ede9fe;color:#7c3aed}
        .local-igrejinha{background:#dcfce7;color:#15803d}

        .stars{display:flex;gap:4px;margin-top:6px}
        .star{font-size:22px;cursor:pointer;color:#ddd;transition:.1s}
        .star.on{color:#f59e0b}
        .criteria-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #f0f0f0}
        .criteria-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
        .criteria-label{flex:1;font-size:14px;font-weight:600;color:#333}
        .criteria-weight{font-size:11px;color:#888;margin-top:2px}

        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:2000}
        .modal.open{display:flex}
        .modal-box{background:#fff;border-radius:12px;padding:28px;width:90%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
        .modal-box h3{font-size:18px;margin-bottom:16px;color:#444;border-bottom:1px solid #eee;padding-bottom:12px}
        .modal-footer{text-align:right;margin-top:20px;display:flex;gap:10px;justify-content:flex-end}
        .btn-close-modal{padding:9px 20px;background:#eee;border:none;border-radius:7px;cursor:pointer;font-weight:600}
        .btn-save-modal{padding:9px 20px;background:#2563eb;color:#fff;border:none;border-radius:7px;cursor:pointer;font-weight:600}

        .loading-msg{text-align:center;padding:60px;color:#2563eb;font-size:16px}
        .empty-msg{text-align:center;padding:60px;color:#aaa;font-size:15px}
        .error-msg{text-align:center;padding:40px;color:#d9534f;background:#fff5f5;border-radius:10px;border:1px solid #fcc}
        .results-count{font-size:12px;color:#888;margin-bottom:12px}
        .info-banner{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:18px}

        .btn-details{padding:8px 14px;background:#fff;color:#2563eb;border:1.5px solid #2563eb;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.2s}
        .btn-details:hover{background:#eff6ff}
        .modal-box.wide{max-width:780px}
        .det-section{margin-bottom:22px}
        .det-section h4{font-size:14px;font-weight:700;color:#1d4ed8;border-bottom:2px solid #dbeafe;padding-bottom:6px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .det-grid{display:grid;grid-template-columns:160px 1fr;gap:8px 14px;font-size:13px}
        .det-grid .lbl{font-weight:600;color:#555}
        .det-grid .val{color:#222;word-break:break-word}
        .det-grid .val a{color:#2563eb;text-decoration:none;word-break:break-all}
        .det-grid .val a:hover{text-decoration:underline}
        .det-event-list{margin:0;padding-left:18px;font-size:13px;color:#222}
        .det-event-list li{margin-bottom:4px}
        .det-empty{font-size:13px;color:#888;font-style:italic;padding:8px 0}
        .det-status-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-left:6px}
        .det-status-completo{background:#d1fae5;color:#065f46}
        .det-status-pendente{background:#fef3c7;color:#92400e}
        .det-status-cancelado{background:#fee2e2;color:#991b1b}
        .det-link-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;color:#1d4ed8;text-decoration:none;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
        .det-link-pill:hover{background:#dbeafe}
        @media(max-width:640px){.av-card-main{align-items:flex-start;flex-direction:column}.av-actions{width:100%;justify-content:flex-start}.av-drawer{padding:18px 16px}.drawer-grid{grid-template-columns:1fr;gap:3px 0}.drawer-grid .lbl{margin-top:8px}}
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginOverlay">
    <div class="login-box">
        <h1>🎭 Painel do Avaliador</h1>
        <p>DAC — UFSC</p>
        <div class="form-field">
            <label>Seu E-mail</label>
            <input type="email" id="viewerEmail" placeholder="avaliador@exemplo.com" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <div class="form-field">
            <label>Senha</label>
            <div class="password-wrap">
                <input type="password" id="viewerPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
                <button type="button" class="toggle-password" aria-label="Mostrar senha" title="Mostrar senha" onclick="togglePasswordVisibility('viewerPass', this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>
        <button class="btn-login" onclick="doLogin()">Entrar</button>
        <div class="login-err" id="loginErr"></div>
        <p style="text-align:center;margin-top:18px;font-size:13px;color:#666">É administrador? <a href="/admin" style="color:#2563eb;font-weight:600;text-decoration:none">Acessar Painel Administrativo</a></p>
    </div>
</div>

<!-- APP -->
<div id="appShell">
    <div class="topbar">
        <div class="topbar-left">
            <h1>🎭 Painel do Avaliador</h1>
            <span class="role-badge" id="roleBadge">Avaliador</span>
        </div>
        <div class="topbar-right">
            <button class="btn-top btn-refresh" onclick="loadData()"><i class="fas fa-sync-alt"></i> Atualizar</button>
            <button class="btn-top btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</button>
        </div>
    </div>

    <div class="content-wrap">
        <div class="info-banner" id="infoBanner">
            <i class="fas fa-info-circle"></i>
            <span id="infoBannerText">Carregando regras de avaliação...</span>
        </div>

        <div class="filters-bar">
            <div class="search-wrap">
                <i class="fas fa-search"></i>
                <input type="text" id="searchAvalia" placeholder="Buscar inscrição para avaliar..." oninput="renderAvaliacaoList()">
            </div>
            <select id="filterLocalAv" class="filter-sel" onchange="renderAvaliacaoList()">
                <option value="">Todos os Locais</option>
                <option value="Teatro">Teatro</option>
                <option value="Igrejinha">Igrejinha</option>
            </select>
            <select id="filterStatusAv" class="filter-sel" onchange="renderAvaliacaoList()">
                <option value="">Todos os Status</option>
                <option value="pendente">Pendentes p/ mim</option>
                <option value="avaliado">Já avaliei</option>
            </select>
        </div>
        <div class="results-count" id="resultsCount"></div>
        <div id="avaliacaoList"><div class="loading-msg"><i class="fas fa-spinner fa-spin"></i> Carregando...</div></div>
    </div>
</div>

<script>
let viewerEmail = '';
let viewerNome = '';
let allUnificados = [];
let criterios = [];
let avaliacoesNecessarias = 3;
let currentAvaliacaoIndex = null;
let currentAvaliacaoScores = {};
let scoresCache = {}; // {inscricaoId: [avaliacoes]}
let openAvaliacaoIndex = null;

// Restaurar sessão
(function restore(){
    const role = localStorage.getItem('dac_role');
    const email = localStorage.getItem('dac_viewer_email');
    const ts = parseInt(localStorage.getItem('dac_ts')||'0', 10);
    const SESSION_MS = 8 * 3600 * 1000;
    if (role === 'viewer' && email && (Date.now() - ts) < SESSION_MS) {
        viewerEmail = email;
        viewerNome = localStorage.getItem('dac_viewer_nome') || email;
        initApp();
    }
})();

function togglePasswordVisibility(inputId, button) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const visible = input.type === 'text';
    input.type = visible ? 'password' : 'text';
    button.setAttribute('aria-label', visible ? 'Mostrar senha' : 'Ocultar senha');
    button.title = visible ? 'Mostrar senha' : 'Ocultar senha';
    button.innerHTML = `<i class="fa-solid ${visible ? 'fa-eye' : 'fa-eye-slash'}"></i>`;
}

async function doLogin() {
    const errEl = document.getElementById('loginErr');
    errEl.style.display = 'none';
    const email = document.getElementById('viewerEmail').value.trim();
    const pass = document.getElementById('viewerPass').value;
    if (!email || !pass) { errEl.textContent = 'Preencha email e senha.'; errEl.style.display = 'block'; return; }
    try {
        const r = await fetch('/api/auth/viewer', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email, password: pass }) });
        const d = await r.json();
        if (d.success) {
            viewerEmail = d.email;
            viewerNome = d.nome || d.email;
            localStorage.setItem('dac_role', 'viewer');
            localStorage.setItem('dac_viewer_email', d.email);
            localStorage.setItem('dac_viewer_nome', viewerNome);
            localStorage.setItem('dac_ts', Date.now());
            initApp();
        } else {
            errEl.textContent = d.message || 'Acesso negado.';
            errEl.style.display = 'block';
        }
    } catch (e) {
        errEl.textContent = 'Erro de conexão. Tente novamente.';
        errEl.style.display = 'block';
    }
}

function logout() {
    localStorage.removeItem('dac_role');
    localStorage.removeItem('dac_viewer_email');
    localStorage.removeItem('dac_viewer_nome');
    localStorage.removeItem('dac_ts');
    location.reload();
}

function initApp() {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('appShell').style.display = 'block';
    document.getElementById('roleBadge').textContent = `Avaliador: ${viewerEmail}`;
    loadCriteria();
    loadConfig();
    loadData();
}

async function loadConfig() {
    try {
        const r = await fetch('/api/config');
        const c = await r.json();
        avaliacoesNecessarias = parseInt(c.avaliacoesNecessarias || 3, 10);
        document.getElementById('infoBannerText').textContent =
            `Cada inscrição precisa de ${avaliacoesNecessarias} avaliação(ões) para ser considerada concluída.`;
    } catch (e) {}
}

async function loadCriteria() {
    try {
        const r = await fetch('/api/criteria');
        const data = await r.json();
        criterios = Array.isArray(data) ? data : [];
    } catch(e) { criterios = []; }
}

async function loadData() {
    document.getElementById('avaliacaoList').innerHTML = '<div class="loading-msg"><i class="fas fa-spinner fa-spin"></i> Carregando inscrições...</div>';
    try {
        const r = await fetch('/api/admin/dados-unificados');
        const data = await r.json();
        allUnificados = Array.isArray(data) ? data : [];
        scoresCache = {};
        // Pré-carregar avaliações em paralelo
        await Promise.all(allUnificados.map(async (item) => {
            const p = item.primeiraEtapa;
            if (!p) return;
            const id = p.id || p.email;
            try {
                const rr = await fetch(`/api/assessments/${encodeURIComponent(id)}`);
                scoresCache[id] = await rr.json();
            } catch(e) { scoresCache[id] = []; }
        }));
        renderAvaliacaoList();
    } catch (e) {
        document.getElementById('avaliacaoList').innerHTML = '<div class="error-msg">Erro ao carregar inscrições. Tente novamente.</div>';
    }
}

function renderAvaliacaoList() {
    const q = (document.getElementById('searchAvalia').value||'').toLowerCase();
    const filterLocal = document.getElementById('filterLocalAv').value;
    const filterStatus = document.getElementById('filterStatusAv').value;
    const container = document.getElementById('avaliacaoList');

    const filtered = allUnificados.filter(item => {
        const p = item.primeiraEtapa;
        if (!p) return false;
        const id = p.id || p.email;
        const avs = scoresCache[id] || [];
        const myAv = avs.find(a => (a.evaluatorEmail||'').toLowerCase() === viewerEmail.toLowerCase());
        const matchQ = !q || (p.evento||'').toLowerCase().includes(q) || (p.nome||'').toLowerCase().includes(q);
        const matchLocal = !filterLocal || (p.localNome||'').toLowerCase().includes(filterLocal.toLowerCase());
        const matchStatus = !filterStatus
            || (filterStatus === 'pendente' && !myAv)
            || (filterStatus === 'avaliado' && !!myAv);
        return matchQ && matchLocal && matchStatus;
    });

    document.getElementById('resultsCount').textContent =
        `Exibindo ${filtered.length} de ${allUnificados.length} inscrição(ões)`;

    if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-msg">Nenhuma inscrição encontrada com esses filtros.</div>';
        return;
    }

    let html = '';
    filtered.forEach(item => {
        const p = item.primeiraEtapa;
        const idx = allUnificados.indexOf(item);
        const id = p.id || p.email;
        const avs = scoresCache[id] || [];
        const myAv = avs.find(a => (a.evaluatorEmail||'').toLowerCase() === viewerEmail.toLowerCase());
        const isIgrejinha = (p.localNome||'').toLowerCase().includes('igrej');
        const minhaMedia = myAv ? calcMedia(myAv.scoresJson || {}) : null;
        const statusBadge = myAv
            ? `<span class="av-status done"><i class="fas fa-check"></i> Avaliado por mim</span>`
            : `<span class="av-status">Pendente</span>`;
        const aberta = openAvaliacaoIndex === idx;
        html += `
        <div class="av-card${aberta ? ' open' : ''}">
            <div class="av-card-main">
                <div class="av-info">
                    <h4>${escapeHtml(p.evento||'SEM EVENTO').toUpperCase()}</h4>
                    <p>${escapeHtml(p.nome||'')} &middot;
                        <span class="local-badge ${isIgrejinha?'local-igrejinha':'local-teatro'}">${escapeHtml(p.localNome||'Teatro')}</span>
                        ${statusBadge}
                        <span style="color:#888;margin-left:6px">(${avs.length}/${avaliacoesNecessarias} avaliações)</span>
                    </p>
                </div>
                <div class="av-actions">
                    ${minhaMedia !== null ? `<span class="av-score">${minhaMedia}/10</span>` : ''}
                    <button class="btn-top btn-refresh" onclick="openAvaliacao(${idx})" aria-expanded="${aberta ? 'true' : 'false'}">
                        <i class="fas fa-star"></i> Avaliar
                    </button>
                </div>
            </div>
            ${aberta ? `<div class="av-drawer" id="avaliacao-drawer-${idx}">${renderDrawerContent(item, myAv?.scoresJson || {})}</div>` : ''}
        </div>`;
    });
    container.innerHTML = html;
}

function calcMedia(scores) {
    const crit = criterios.length ? criterios : defaultCriterios();
    let total = 0, peso = 0;
    crit.forEach(c => {
        const v = parseFloat(scores[c.id] || 0);
        total += v * (c.peso || 1);
        peso += (c.peso || 1);
    });
    return peso > 0 ? (total / peso).toFixed(1) : '—';
}

function defaultCriterios() {
    return [
        { id: 'A', nome: 'Qualidade Artística', peso: 1 },
        { id: 'B', nome: 'Relevância Cultural', peso: 1 },
        { id: 'C', nome: 'Acessibilidade', peso: 1 },
        { id: 'D', nome: 'Viabilidade Técnica', peso: 1 }
    ];
}

// === GAVETA DA INSCRIÇÃO E AVALIAÇÃO ===
function looksLikeUrl(s) {
    if (typeof s !== 'string') return false;
    return /^https?:\/\//i.test(s.trim());
}

function renderValueAsHtml(v) {
    if (v === null || v === undefined || v === '') return '<span style="color:#aaa">—</span>';
    const str = String(v);
    const parts = str.split(/[\s,;\n]+/).filter(Boolean);
    const allUrls = parts.length > 0 && parts.every(p => looksLikeUrl(p));
    if (allUrls) {
        return parts.map(u => {
            const isDrive = /drive\.google\.com|docs\.google\.com/i.test(u);
            const icon = isDrive ? 'fa-google-drive' : 'fa-up-right-from-square';
            const label = isDrive ? 'Abrir no Drive' : 'Abrir link';
            return `<a class="drawer-link-pill" href="${escapeAttr(u)}" target="_blank" rel="noopener"><i class="fab ${isDrive ? 'fa-google-drive' : ''}"></i><i class="fas ${isDrive ? '' : icon}"></i> ${label}</a>`;
        }).join(' ');
    }
    return escapeHtml(str).replace(/(https?:\/\/[^\s,;<>"']+)/gi, (m) =>
        `<a href="${escapeAttr(m)}" target="_blank" rel="noopener">${escapeHtml(m)}</a>`);
}

function escapeAttr(s) {
    return String(s||'').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function formatarValorDrawer(valor) {
    if (Array.isArray(valor)) return valor.filter(v => String(v ?? '').trim()).join(', ');
    if (valor && typeof valor === 'object') {
        return Object.entries(valor)
            .map(([chave, item]) => `${chave}: ${formatarValorDrawer(item)}`)
            .join(' | ');
    }
    return String(valor ?? '').trim();
}

function obterDadosComplementaresDrawer(item) {
    const p = item?.primeiraEtapa || {};
    const dadosUnificados = p.segundaEtapaTeste;
    if (p.inscricaoTeste === true && dadosUnificados && typeof dadosUnificados === 'object') {
        const labels = {
            tipoProponente: 'Tipo de proponente',
            nomePessoaFisica: 'Nome da pessoa física',
            cpfPessoaFisica: 'CPF',
            cepPessoaFisica: 'CEP residencial',
            representantePessoaJuridica: 'Representante da pessoa jurídica',
            razaoSocialPessoaJuridica: 'Razão social',
            cnpjPessoaJuridica: 'CNPJ',
            enderecoPessoaJuridica: 'Endereço da pessoa jurídica',
            categoriaProposta: 'Categoria da proposta',
            vinculoUfsc: 'Vínculo com a UFSC',
            descricaoVinculoUfsc: 'Descrição do vínculo com a UFSC',
            areas: 'Área/segmento',
            finalidade: 'Finalidade',
            sinopse: 'Sinopse/descrição da proposta',
            relevancia: 'Relevância cultural e impacto social',
            acessibilidade: 'Acessibilidade comunicacional',
            recursosAcessibilidade: 'Recursos de acessibilidade',
            descricaoOutroRecursoAcessibilidade: 'Descrição de outro recurso de acessibilidade',
            gratuidade: 'Gratuidade do evento',
            projetoDac: 'Projeto do DAC',
            arquivos: 'Arquivos enviados'
        };
        const ignoradas = new Set(['id', 'nome', 'email', 'telefone', 'evento', 'local', 'etapas', 'documentos', 'arquivos', 'concluidaEm']);
        return Object.entries(dadosUnificados)
            .filter(([chave, valor]) => !ignoradas.has(chave) && formatarValorDrawer(valor))
            .map(([chave, valor]) => [
                labels[chave] || chave.replace(/([A-Z])/g, ' $1').replace(/^./, letra => letra.toUpperCase()),
                formatarValorDrawer(valor)
            ]);
    }

    const s = item?.segundaEtapa;
    if (s && Array.isArray(s.headers) && Array.isArray(s.valores)) {
        return s.headers.map((header, index) => [
            String(header || 'Campo'),
            formatarValorDrawer(s.valores[index]) || '—'
        ]);
    }
    return [];
}

function formatarEtapaDrawer(etapa, fallbackTipo) {
    if (!etapa) return '';
    const data = etapa.data || '';
    const horario = etapa.horario || '';
    return `${data ? data.split('-').reverse().join('/') : '—'}${horario ? `, ${horario}` : ''} (${fallbackTipo})`;
}

function obterRotuloDocumentoDrawer(documento) {
    const rotulos = {
        testeCurriculoPessoaFisica: 'Pessoa Física — Currículo',
        testeDocumentoPessoaFisica: 'Pessoa Física — Documento oficial',
        testePortfolioPessoaJuridica: 'Pessoa Jurídica — Portfólio',
        testeContratoPessoaJuridica: 'Pessoa Jurídica — Contrato',
        testeDocumentoRepresentantePessoaJuridica: 'Pessoa Jurídica — Documento do representante',
        testeDocumentoCnpjPessoaJuridica: 'Pessoa Jurídica — Documento do CNPJ',
        testeComprovanteVinculoUfsc: 'Pessoa Jurídica — Comprovante de vínculo com a UFSC',
        testeFichaTecnicaProposta: 'Proposta — Ficha técnica',
        testeLinksVideoProposta: 'Proposta — Links de vídeo/fotos',
        testeOutrosLinksProposta: 'Proposta — Outros documentos',
        formsCurriculo: 'Google Forms — Currículo',
        formsDocumentoOficial: 'Google Forms — Documento oficial',
        formsPortfolio: 'Google Forms — Portfólio',
        formsContrato: 'Google Forms — Contrato',
        formsDocumentoRepresentante: 'Google Forms — Documento do representante',
        formsDocumentoCnpj: 'Google Forms — Documento do CNPJ',
        formsComprovanteVinculo: 'Google Forms — Comprovante de vínculo',
        formsFichaTecnica: 'Google Forms — Ficha técnica',
        formsLinksVideo: 'Google Forms — Links de vídeo/fotos',
        formsDocumento: 'Google Forms — Outros documentos'
    };
    return documento?.categoria || documento?.colunaForms || rotulos[documento?.campo] || documento?.campo || 'Arquivo enviado';
}

function formatarTamanhoDocumentoDrawer(bytes) {
    const tamanho = Number(bytes) || 0;
    if (!tamanho) return '';
    if (tamanho < 1024) return `${tamanho} B`;
    if (tamanho < 1024 * 1024) return `${(tamanho / 1024).toFixed(1)} KB`;
    return `${(tamanho / (1024 * 1024)).toFixed(1)} MB`;
}

function renderDocumentosDrawer(item) {
    const p = item?.primeiraEtapa || {};
    const documentos = Array.isArray(p.documentos) ? p.documentos.filter(Boolean) : [];
    if (!documentos.length) return '<div class="drawer-empty">Nenhum arquivo enviado para esta inscrição.</div>';
    return `<div style="display:grid;gap:10px">${documentos.map(documento => {
        const url = p.id && documento.id
            ? `/api/admin/documentos/${encodeURIComponent(p.id)}/${encodeURIComponent(documento.id)}`
            : '';
        const detalhes = [documento.mimeType, formatarTamanhoDocumentoDrawer(documento.tamanho)].filter(Boolean).join(' · ');
        const visualizar = url
            ? `<a href="${url}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:#2563eb;font-size:12px;font-weight:700;text-decoration:none"><i class="fas fa-eye"></i> Visualizar</a>`
            : '<span style="color:#aaa;font-size:12px">Visualização indisponível</span>';
        return `<div style="display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid #dbeafe;border-radius:8px;background:#fff;padding:10px 12px">
            <div style="min-width:0">
                <div style="font-size:11px;font-weight:700;color:#1d4ed8;margin-bottom:3px">${escapeHtml(obterRotuloDocumentoDrawer(documento))}</div>
                <div style="font-size:13px;color:#1f2937;word-break:break-word">${escapeHtml(documento.nome || 'Arquivo sem nome')}</div>
                ${detalhes ? `<div style="font-size:11px;color:#94a3b8;margin-top:3px">${escapeHtml(detalhes)}</div>` : ''}
            </div>
            ${visualizar}
        </div>`;
    }).join('')}</div>`;
}
function renderDrawerContent(item, existingScores = {}) {
    const p = item?.primeiraEtapa || {};
    const dadosComplementares = obterDadosComplementaresDrawer(item);
    const nomesEtapas = {ensaio:'Ensaio',montagem:'Montagem',evento:'Evento',desmontagem:'Desmontagem'};
    const eventos = [];
    Object.keys(p.etapas || {}).forEach(key => {
        const itens = Array.isArray(p.etapas[key]) ? p.etapas[key] : [p.etapas[key]];
        itens.forEach(etapa => {
            if (etapa) eventos.push({ etapa, tipo: nomesEtapas[key] || key });
        });
    });

    let html = `
        <div class="drawer-heading">
            <div>
                <h3><i class="fas fa-file-alt"></i> Inscrição completa</h3>
                <p>Todos os dados usados na ficha de inscrição do proponente.</p>
            </div>
        </div>
        <div class="drawer-section">
            <h4><i class="fas fa-user"></i> Dados do proponente</h4>
            <div class="drawer-grid">
                ${[
                    ['Proponente', p.nome],
                    ['E-mail', p.email],
                    ['Telefone', p.telefone],
                    ['Local', p.localNome || 'Teatro Carmen Fossari'],
                    ['Evento', p.evento],
                    ['Inscrição', p.timestamp]
                ].map(([label, value]) => `<div class="lbl">${escapeHtml(label)}:</div><div class="val">${renderValueAsHtml(value || '—')}</div>`).join('')}
            </div>
        </div>
        <div class="drawer-section">
            <h4><i class="fas fa-calendar-days"></i> Cronograma agendado</h4>
            ${eventos.length ? `<ul class="drawer-event-list">${eventos.map(({etapa, tipo}) => `<li>${escapeHtml(formatarEtapaDrawer(etapa, tipo))}</li>`).join('')}</ul>` : '<div class="drawer-empty">Sem etapas agendadas via site.</div>'}
        </div>
        <div class="drawer-section">
            <h4><i class="fas fa-clipboard-list"></i> Dados complementares (formulário)</h4>
            ${dadosComplementares.length ? `<div class="drawer-grid">${dadosComplementares.map(([label, value]) => `<div class="lbl">${escapeHtml(label)}:</div><div class="val">${renderValueAsHtml(value)}</div>`).join('')}</div>` : '<div class="drawer-empty">Nenhum dado complementar preenchido.</div>'}
        </div>
        <div class="drawer-section">
            <h4><i class="fas fa-paperclip"></i> Arquivos enviados</h4>
            ${renderDocumentosDrawer(item)}
        </div>
        <div class="drawer-evaluation">
            <h4><i class="fas fa-star"></i> Avaliação</h4>
            <p class="drawer-evaluation-note">Dê uma nota de 1 a 10 para cada critério.</p>
            ${renderCriteriaRows(existingScores)}
            <div class="drawer-save">
                <button class="btn-save-modal" onclick="salvarAvaliacao()"><i class="fas fa-save"></i> Salvar Avaliação</button>
            </div>
        </div>`;
    return html;
}

function renderCriteriaRows(existingScores = {}) {
    const crit = criterios.length ? criterios : defaultCriterios();
    return crit.map(c => {
        const nota = parseInt(existingScores[c.id] || 0);
        let stars = '';
        for (let s = 1; s <= 10; s++) {
            stars += `<span class="star ${s<=nota?'on':''}" onclick="setStar('${c.id}',${s})" data-v="${s}">★</span>`;
        }
        return `<div class="criteria-row">
            <div class="criteria-label">${escapeHtml(c.nome)}<div class="criteria-weight">Peso: ${c.peso||1}</div></div>
            <div>
                <div class="stars" id="stars-${c.id}">${stars}</div>
                <div style="text-align:center;font-size:12px;color:#2563eb;margin-top:4px" id="starLabel-${c.id}">${nota>0?nota+'/10':'—'}</div>
            </div>
        </div>`;
    }).join('');
}

async function openAvaliacao(idx) {
    if (openAvaliacaoIndex === idx) {
        openAvaliacaoIndex = null;
        currentAvaliacaoIndex = null;
        renderAvaliacaoList();
        return;
    }
    openAvaliacaoIndex = idx;
    currentAvaliacaoIndex = idx;
    currentAvaliacaoScores = {};
    renderAvaliacaoList();
    const drawer = document.getElementById(`avaliacao-drawer-${idx}`);
    if (drawer) drawer.innerHTML = '<div class="drawer-loading"><i class="fas fa-spinner fa-spin"></i> Carregando inscrição completa...</div>';

    const p = allUnificados[idx]?.primeiraEtapa;
    if (!p) return;
    const id = p.id || p.email;
    try {
        const documentosResponse = await fetch(`/api/admin/inscricoes/${encodeURIComponent(id)}/documentos?_=${Date.now()}`);
        const documentosData = await documentosResponse.json().catch(() => ({}));
        if (documentosResponse.ok && Array.isArray(documentosData.documentos)) p.documentos = documentosData.documentos;
    } catch (e) {}
    let existingScores = {};
    try {
        const r = await fetch(`/api/assessments/${encodeURIComponent(id)}`);
        const avs = await r.json();
        scoresCache[id] = avs;
        const myAv = avs.find(a => (a.evaluatorEmail||'').toLowerCase() === viewerEmail.toLowerCase());
        if (myAv) existingScores = myAv.scoresJson || {};
    } catch(e) {}
    if (openAvaliacaoIndex !== idx) return;
    currentAvaliacaoScores = { ...existingScores };
    renderAvaliacaoList();
}

function setStar(criterioId, valor) {
    currentAvaliacaoScores[criterioId] = valor;
    const stars = document.querySelectorAll(`#stars-${criterioId} .star`);
    stars.forEach(s => s.classList.toggle('on', parseInt(s.dataset.v) <= valor));
    const label = document.getElementById(`starLabel-${criterioId}`);
    if (label) label.textContent = `${valor}/10`;
}

async function salvarAvaliacao() {
    if (currentAvaliacaoIndex === null) return;
    const p = allUnificados[currentAvaliacaoIndex].primeiraEtapa;
    const id = p.id || p.email;
    if (!viewerEmail) { alert('Sessão expirada. Faça login novamente.'); return; }
    const crit = criterios.length ? criterios : defaultCriterios();
    const faltando = crit.filter(c => !currentAvaliacaoScores[c.id]);
    if (faltando.length > 0) {
        if (!confirm(`Você ainda não deu nota a ${faltando.length} critério(s). Salvar mesmo assim?`)) return;
    }
    try {
        const r = await fetch('/api/save-assessment', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ inscriptionId: id, evaluatorEmail: viewerEmail, scoresJson: currentAvaliacaoScores })
        });
        const d = await r.json();
        if (d.success) {
            openAvaliacaoIndex = null;
            currentAvaliacaoIndex = null;
            // Atualizar cache local
            try {
                const rr = await fetch(`/api/assessments/${encodeURIComponent(id)}`);
                scoresCache[id] = await rr.json();
            } catch(e) {}
            renderAvaliacaoList();
            alert('Avaliação salva com sucesso!');
        } else {
            alert('Erro ao salvar: ' + (d.error||''));
        }
    } catch(e) {
        alert('Erro de conexão: ' + e.message);
    }
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function escapeHtml(s) {
    return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
